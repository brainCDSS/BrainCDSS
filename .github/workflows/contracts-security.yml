name: Contracts and repository policy
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python tests/contract/validate_contracts.py
      - run: python tests/security/repository_policy_test.py
      - run: git ls-files | grep -E '\.(dcm|dicom|nii|nii\.gz|pt|pth|ckpt|onnx|engine)$' && exit 1 || true
