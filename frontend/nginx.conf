server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ========================================================
    # Django Backend
    # ========================================================

    location /api/ {
        proxy_pass https://brainon-backend-v2-3gykqo24da-as.a.run.app;

        proxy_ssl_server_name on;
        proxy_ssl_name brainon-backend-v2-3gykqo24da-as.a.run.app;

        proxy_set_header Host brainon-backend-v2-3gykqo24da-as.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }


    # ========================================================
    # Grafana
    #
    # /grafana/login 요청의 Authorization JWT도 Gateway로 전달.
    # 실제 JWT 검증과 X-WEBAUTH 생성은 내부 Gateway가 수행한다.
    # ========================================================

    location /grafana/ {
        proxy_pass http://10.148.0.5:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /grafana;

        proxy_set_header Authorization $http_authorization;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Grafana root_url already contains /grafana/.
        # Preserve Grafana's own cookie Path.
        proxy_cookie_path off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }


    # ========================================================
    # React SPA
    # ========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }
}
