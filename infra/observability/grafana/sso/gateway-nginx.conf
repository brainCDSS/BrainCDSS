events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    server {
        listen 8080;
        server_name _;


        # ----------------------------------------------------
        # Django SYSTEM_ADMIN 인증
        # ----------------------------------------------------

        location = /_brainon_grafana_auth {
            internal;

            proxy_pass
                https://brainon-backend-v2-3gykqo24da-as.a.run.app/api/v1/admin/grafana/auth;

            proxy_ssl_server_name on;
            proxy_ssl_name
                brainon-backend-v2-3gykqo24da-as.a.run.app;

            proxy_set_header
                Host
                brainon-backend-v2-3gykqo24da-as.a.run.app;

            proxy_set_header
                Authorization
                $http_authorization;

            proxy_set_header
                X-Original-URI
                $request_uri;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }


        # ----------------------------------------------------
        # 최초 로그인
        # ----------------------------------------------------

        location = /grafana/login {
            auth_request
                /_brainon_grafana_auth;

            auth_request_set
                $grafana_user
                $upstream_http_x_grafana_user;

            auth_request_set
                $grafana_role
                $upstream_http_x_grafana_role;


            # 사용자가 넣은 값이 아니라
            # Django 검증 결과로 무조건 덮어쓴다.
            proxy_set_header
                X-WEBAUTH-USER
                $grafana_user;

            proxy_set_header
                X-WEBAUTH-ROLE
                $grafana_role;


            # BrainOn JWT는 Grafana로 전달하지 않는다.
            proxy_set_header
                Authorization
                "";


            proxy_set_header
                Host
                $http_host;

            proxy_set_header
                X-Forwarded-Host
                $http_host;

            proxy_set_header
                X-Forwarded-Proto
                https;

            proxy_set_header
                X-Forwarded-Prefix
                /grafana;


            proxy_http_version 1.1;

            proxy_set_header
                Upgrade
                $http_upgrade;

            proxy_set_header
                Connection
                $connection_upgrade;


            # Grafana와 Gateway가 공유하는
            # 전용 Docker network의 고정 IP
            proxy_pass
                http://172.31.250.3:3000;

            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }


        # ----------------------------------------------------
        # 로그인 이후 요청
        #
        # Auth Proxy header는 절대로 외부 입력을 전달하지 않는다.
        # Grafana login token cookie로 인증한다.
        # ----------------------------------------------------

        location /grafana/ {
            proxy_set_header
                X-WEBAUTH-USER
                "";

            proxy_set_header
                X-WEBAUTH-ROLE
                "";

            proxy_set_header
                Authorization
                "";

            proxy_set_header
                Host
                $http_host;

            proxy_set_header
                X-Forwarded-Host
                $http_host;

            proxy_set_header
                X-Forwarded-Proto
                https;

            proxy_set_header
                X-Forwarded-Prefix
                /grafana;

            proxy_http_version 1.1;

            proxy_set_header
                Upgrade
                $http_upgrade;

            proxy_set_header
                Connection
                $connection_upgrade;

            proxy_pass
                http://172.31.250.3:3000;

            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }


        location / {
            return 404;
        }
    }
}
