events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # ====================================================
        # Django SYSTEM_ADMIN 인증
        # ====================================================

        location = /_brainon_grafana_auth {
            internal;

            proxy_pass
                http://backend:8080/api/v1/admin/grafana/auth;

            proxy_set_header
                Host
                backend;

            proxy_set_header
                Authorization
                $http_authorization;

            proxy_set_header
                X-Original-URI
                $request_uri;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ====================================================
        # 최초 Grafana 로그인
        # ====================================================

        location = /grafana/login {
            auth_request
                /_brainon_grafana_auth;

            auth_request_set
                $grafana_user
                $upstream_http_x_grafana_user;

            auth_request_set
                $grafana_role
                $upstream_http_x_grafana_role;

            # 외부 입력이 아니라 Django 검증 결과만 전달
            proxy_set_header
                X-WEBAUTH-USER
                $grafana_user;

            proxy_set_header
                X-WEBAUTH-ROLE
                $grafana_role;

            # BrainOn JWT를 Grafana 자체에는 전달하지 않음
            proxy_set_header
                Authorization
                "";

            proxy_set_header
                Host
                $http_host;

            proxy_set_header
                X-Forwarded-Host
                $http_host;

            proxy_set_header
                X-Forwarded-Proto
                http;

            proxy_set_header
                X-Forwarded-Prefix
                /grafana;

            proxy_http_version 1.1;

            proxy_set_header
                Upgrade
                $http_upgrade;

            proxy_set_header
                Connection
                $connection_upgrade;

            proxy_pass
                http://172.31.251.3:3000;

            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # ====================================================
        # 로그인 이후 Grafana 요청
        # ====================================================

        location /grafana/ {
            # Browser가 임의 Auth Proxy header를 주입하지 못하게 제거
            proxy_set_header
                X-WEBAUTH-USER
                "";

            proxy_set_header
                X-WEBAUTH-ROLE
                "";

            proxy_set_header
                Authorization
                "";

            proxy_set_header
                Host
                $http_host;

            proxy_set_header
                X-Forwarded-Host
                $http_host;

            proxy_set_header
                X-Forwarded-Proto
                http;

            proxy_set_header
                X-Forwarded-Prefix
                /grafana;

            proxy_http_version 1.1;

            proxy_set_header
                Upgrade
                $http_upgrade;

            proxy_set_header
                Connection
                $connection_upgrade;

            proxy_pass
                http://172.31.251.3:3000;

            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # /grafana 외에는 아무것도 제공하지 않음
        location / {
            return 404;
        }
    }
}
