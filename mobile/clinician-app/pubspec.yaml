name: brainon_clinician_app

description: BrainOn CDSS clinician mobile application shell.

publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  brainon_mobile_core:
    path: ../packages/brainon_mobile_core

  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_markdown_plus: ^1.0.12
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - asset/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "asset/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "asset/images/logo.png"
  adaptive_icon_foreground_inset: 20
